[build-system]
requires      = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name        = "csv2keepass"
version     = "1.0.0"
description = "Import browser-exported CSV password files into a KeePass database"
readme      = "README.md"
license     = { text = "MIT" }
requires-python = ">=3.10"

keywords = ["keepass", "passwords", "csv", "chrome", "brave", "import", "migration"]

classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Utilities",
]

dependencies = [
    "pykeepass>=4.0.0",
]

[project.scripts]
csv2keepass = "csv2keepass.cli:main"

[project.urls]
Homepage   = "https://github.com/yourusername/csv2keepass"
Issues     = "https://github.com/yourusername/csv2keepass/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["csv2keepass*"]
